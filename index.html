<title>我的小站 - 个人收藏与记录</title>

<style>
:root{--bg:#0b1220;--card:#0f172a;--text:#e6eef8;--muted:#94a3b8;--accent:#60a5fa;--accent2:#8b5cf6;--success:#34d399;--warn:#fbbf24;--danger:#f87171;--border:#1e293b;--shadow:0 10px 30px rgba(0,0,0,.35)}
[data-theme=light]{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--shadow:0 10px 30px rgba(0,0,0,.08)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:var(--accent);text-decoration:none}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(15,23,42,.95),rgba(15,23,42,.75));backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.container{max-width:1200px;margin:0 auto;padding:0 16px}
.nav{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.brand .logo{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:14px}
.grow{flex:1}
.nav a{opacity:.9;padding:6px 10px;border-radius:6px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.active{background:rgba(96,165,250,.15);color:var(--accent)}
.search{position:relative;min-width:220px;flex:1;max-width:420px}
.search input{width:100%;padding:10px 12px 10px 36px;border-radius:8px;border:1px solid var(--border);background:#0b1220;color:var(--text)}
.search::before{content:"";position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;background:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%2394a3b8%22><path d=%22M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM9.5 14C7.57 14 6 12.43 6 10.5S7.57 7 9.5 7 13 8.57 13 10.5 11.43 14 9.5 14z%22/></svg>') no-repeat center;background-size:contain}
.actions{display:flex;gap:8px;align-items:center}
.btn{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b1220}
.statusbar{background:var(--card);border-bottom:1px solid var(--border);padding:8px 0;font-size:12px;color:var(--muted)}
.statusbar .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(96,165,250,.12);color:var(--accent);font-size:12px}
.badge.success{background:rgba(52,211,153,.12);color:var(--success)}
.badge.warn{background:rgba(251,191,36,.12);color:var(--warn)}
main{padding:16px 0 40px}
.section-title{font-size:20px;font-weight:700;margin:8px 0 12px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.cover{height:140px;background:linear-gradient(135deg,#334155,#1e293b);position:relative}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .emoji{position:absolute;right:8px;bottom:8px;font-size:22px;opacity:.9}
.content{padding:12px}
.content .title{font-weight:700;margin:0 0 6px}
.content .meta{color:var(--muted);font-size:13px;margin:4px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;padding:4px 8px;border-radius:999px;background:rgba(148,163,184,.12);color:var(--muted)}
.tag.accent{background:rgba(96,165,250,.15);color:var(--accent)}
.hero{background:linear-gradient(135deg,#0f172a,#1e293b);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}
.hero h1{margin:0 0 8px;font-size:28px}
.hero p{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat .num{font-size:28px;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat .label{color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{cursor:pointer;padding:8px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:13px}
.chip:hover{border-color:var(--accent)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#0b1220}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.toast{position:fixed;right:16px;bottom:16px;padding:12px 16px;border-radius:10px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);z-index:100;transform:translateY(120%);transition:transform .3s ease}
.toast.show{transform:translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:60;padding:16px}
.modal.active{display:grid}
.modal>div{background:var(--card);border:1px solid var(--border);border-radius:12px;max-width:560px;width:100%;padding:16px}
.modal h3{margin:0 0 12px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.form label{display:block;margin:8px 0 4px;font-size:13px;color:var(--muted)}
.form input,.form textarea,.form select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:#0b1220;color:var(--text)}
.detail-hero{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--border);margin-bottom:16px}
.detail-hero .bg{height:220px;background:linear-gradient(135deg,#334155,#1e293b);position:relative}
.detail-hero .bg img{width:100%;height:100%;object-fit:cover}
.detail-hero .info{position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent)}
.detail-hero .title{font-size:24px;font-weight:700;margin:0}
.detail-hero .meta{margin-top:6px;color:#cbd5e1}
.detail-body{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
.detail-body h3{margin:16px 0 8px;font-size:16px}
.detail-body p{color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.shelf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.shelf-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center}
.shelf-item .thumb{width:64px;height:64px;border-radius:8px;background:linear-gradient(135deg,#334155,#1e293b);flex-shrink:0}
.shelf-item .thumb img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.shelf-item .info{min-width:0}
.shelf-item .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shelf-item .sub{color:var(--muted);font-size:12px}
.stars{color:var(--warn)}
.commentbox{background:rgba(148,163,184,.08);border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:12px}
.commentbox textarea{width:100%;min-height:80px;background:transparent;border:0;color:var(--text);resize:vertical}
.commentbox .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.diy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.diy-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}
.diy-card .title{font-weight:700;margin-bottom:6px}
.diy-card .url{font-size:12px;color:var(--muted);word-break:break-all}
.diy-card .actions{margin-top:8px;display:flex;gap:8px}
kbd{background:var(--border);padding:2px 6px;border-radius:4px;font-size:12px;font-family:monospace}
.footer{text-align:center;padding:24px;color:var(--muted);font-size:13px;border-top:1px solid var(--border);margin-top:24px}
@media (max-width:640px){.nav{gap:8px}.search{min-width:180px}.grid{grid-template-columns:1fr}.hero h1{font-size:22px}}
</style>

function updateStatus(){document.getElementById('stat-games').textContent='游戏 '+DATA.games.length;document.getElementById('stat-novels').textContent='小说 '+DATA.novels.length;document.getElementById('stat-study').textContent='学习 '+DATA.study.length;document.getElementById('stat-movies').textContent='影音 '+DATA.movies.length;document.getElementById('stat-shelf').textContent='书架 '+shelf().length}
function renderHome(){const now=new Date();const hr=now.getHours();const greet=(hr<5?'深夜好':hr<9?'早上好':hr<12?'上午好':hr<14?'中午好':hr<18?'下午好':'晚上好')+(nick()?','+nick():'')+'!';const dateStr=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${'日一二三四五六'[now.getDay()]}`;const seed=Number(String(now.getFullYear())+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0'));const pickG=DATA.games[seed%DATA.games.length];const pickN=DATA.novels[(seed*7)%DATA.novels.length];const pickS=DATA.study[(seed*13)%DATA.study.length];const pickM=DATA.movies[(seed*17)%DATA.movies.length];const sm=stateMap();const playing=DATA.games.map(g=>({g,st:sm['games:'+g.id]||{}})).filter(x=>x.st.status==='playing').map(x=>({it:x.g,h:Number(getTime('games',x.g.id).game)||0})).sort((a,b)=>b.h-a.h).slice(0,3);const reading=DATA.novels.map(n=>({n,st:sm['novels:'+n.id]||{}})).filter(x=>Number(x.st.chapter)>0).sort((a,b)=>(b.st.chapter||0)-(a.st.chapter||0)).slice(0,3);const rated=DATA.games.map(g=>({g,st:sm['games:'+g.id]||{}})).filter(x=>x.st.rating).sort((a,b)=>(b.st.rating||0)-(a.st.rating||0)).slice(0,5);const feed=[...DATA.games.filter(g=>g.fresh).map(g=>({m:'games',it:g})),...DATA.novels.filter(n=>n.fresh).map(n=>({m:'novels',it:n})),...DATA.movies.filter(m=>m.fresh).map(m=>({m:'movies',it:m}))].slice(0,8);const s=shelf();let gameH=0,useH=0;s.forEach(x=>{const t=getTime(x.mod,x.id);gameH+=Number(t.game)||0;useH+=Number(t.use)||0});const quote=todayQuote();const pick=(it,mod,tag)=>`<div class="pick" data-href="#/${mod}/${it.id}"><div class="pcover" style="background:${cover(it.id)}">${(effImg(mod,it.id)||it.img)?`<img src="${esc(effImg(mod,it.id)||it.img)}" alt="" onerror="this.remove()">`:''}<span class="emoji">${catEmoji(it.cat)}</span></div><div style="min-width:0"><div class="pt">${esc(it.name)}</div><div class="pm">${tag} · ${esc(it.cat)}</div></div></div>`;app.innerHTML=`<div class="hero"><div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px"><div><h1>${esc(greet)}</h1><p>${dateStr}</p></div><div style="text-align:right"><div class="quote" style="font-style:italic;color:var(--muted);max-width:320px">"${quote[0]}"</div><div style="font-size:12px;color:var(--muted);margin-top:4px">——${quote[1]}</div></div></div><div style="margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center"><button class="btn ${todayDone()?'':'primary'}" data-act="checkin">${todayDone()?'✅ 今日已打卡':'📌 今日打卡'}</button><button class="btn" data-act="random">🎲 随机一签</button><div style="flex:1;min-width:200px"><div style="font-size:12px;color:var(--muted);margin-bottom:4px">本月打卡 ${checkins().length} 天 · 连续 ${streakDays()} 天</div>${monthHeat()}</div></div></div><div class="stats"><div class="stat"><div class="num">${DATA.games.length}</div><div class="label">游戏</div></div><div class="stat"><div class="num">${DATA.novels.length}</div><div class="label">小说</div></div><div class="stat"><div class="num">${DATA.study.length}</div><div class="label">学习</div></div><div class="stat"><div class="num">${DATA.movies.length}</div><div class="label">影音</div></div><div class="stat"><div class="num">${s.length}</div><div class="label">书架</div></div><div class="stat"><div class="num">${Math.round(gameH)}</div><div class="label">游戏时长(h)</div></div></div><div class="section-title">📋 今日推荐</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:20px">${pick(pickG,'games','今日游戏')}${pick(pickN,'novels','今日小说')}${pick(pickS,'study','今日学习')}${pick(pickM,'movies','今日影音')}</div><div class="section-title">🔥 正在游玩</div>${playing.length?`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px">${playing.map(x=>pick(x.it,'games',x.h+'h')).join('')}</div>`:'<p style="color:var(--muted)">暂无正在游玩的游戏</p>'}<div class="section-title">📖 正在阅读</div>${reading.length?`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px">${reading.map(x=>pick(x.n,'novels','第'+x.st.chapter+'章')).join('')}</div>`:'<p style="color:var(--muted)">暂无正在阅读的小说</p>'}<div class="section-title">⭐ 高分游戏</div>${rated.length?`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px">${rated.map(x=>pick(x.g,'games',x.st.rating+'星')).join('')}</div>`:'<p style="color:var(--muted)">暂无评分记录</p>'}<div class="section-title">🆕 最新上新</div><div class="grid">${feed.map(x=>renderCard(x.it,x.m)).join('')}</div>`;bindLinks()}
function renderCard(it,mod){const st=getState(mod,it.id);return `<div class="card" data-href="#/${mod}/${it.id}"><div class="cover" style="background:${cover(it.id)}">${(effImg(mod,it.id)||it.img)?`<img src="${esc(effImg(mod,it.id)||it.img)}" alt="" onerror="this.remove()">`:''}<span class="emoji">${catEmoji(it.cat)}</span></div><div class="content"><div class="title">${esc(it.name)}</div><div class="meta">${esc(it.cat)}${it.year?' · '+it.year:''}${it.author?' · '+esc(it.author):''}${it.platform?' · '+esc(it.platform):''}</div><div class="tags">${it.fresh?'<span class="tag accent">NEW</span>':''}${st.status?`<span class="tag" style="background:${ST[st.status]?.c||''}22;color:${ST[st.status]?.c||''}">${ST[st.status]?.t||st.status}</span>`:''}${st.rating?`<span class="tag">⭐${st.rating}</span>`:''}</div></div></div>`}
function renderList(mod,title,items,catFilter='all'){const cats=['all',...new Set(items.map(x=>x.cat))];const sort=localStorage.getItem(`yz_sort_${mod}`)||'default';const filtered=catFilter==='all'?items:items.filter(x=>x.cat===catFilter);const sorted=[...filtered];if(sort==='name')sorted.sort((a,b)=>a.name.localeCompare(b.name));if(sort==='year')sorted.sort((a,b)=>(b.year||0)-(a.year||0));if(sort==='hot')sorted.sort((a,b)=>(b.hot||0)-(a.hot||0));app.innerHTML=`<div class="section-title">${title} (${sorted.length})</div><div class="chips">${cats.map(c=>`<span class="chip ${c===catFilter?'active':''}" data-cat="${c}">${c==='all'?'全部':c}</span>`).join('')}</div><div style="margin-bottom:12px"><label style="font-size:13px;color:var(--muted)">排序: </label><select id="sortSel" style="padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text)"><option value="default" ${sort==='default'?'selected':''}>默认</option><option value="name" ${sort==='name'?'selected':''}>名称</option><option value="year" ${sort==='year'?'selected':''}>年份</option>${items[0]?.hot?'<option value="hot" '+(sort==='hot'?'selected':'')+'>热度</option>':''}</select></div><div class="grid">${sorted.map(it=>renderCard(it,mod)).join('')}</div>${sorted.length?'':'<div class="empty">暂无内容</div>'}`;bindLinks();document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>renderList(mod,title,items,c.dataset.cat));document.getElementById('sortSel').onchange=e=>{localStorage.setItem(`yz_sort_${mod}`,e.target.value);renderList(mod,title,items,catFilter)}}
function renderDetail(mod,id){const arr=DATA[mod];const it=arr.find(x=>x.id===id);if(!it)return location.hash='#/home';const st=getState(mod,id);const isGame=mod==='games';const isNovel=mod==='novels';const related=arr.filter(x=>x.id!==id&&x.cat===it.cat).slice(0,4);app.innerHTML=`<div class="detail-hero"><div class="bg" style="background:${cover(it.id)}">${(effImg(mod,it.id)||it.img)?`<img src="${esc(effImg(mod,it.id)||it.img)}" alt="" onerror="this.remove()">`:''}</div><div class="info"><div class="title">${esc(it.name)}</div><div class="meta">${catEmoji(it.cat)} ${esc(it.cat)}${it.year?' · '+it.year:''}${it.platform?' · '+esc(it.platform):''}${it.author?' · '+esc(it.author):''}${it.dev?' · '+esc(it.dev):''}</div></div></div><div class="detail-body"><p>${esc(it.desc)}</p><div class="toolbar"><button class="btn ${inShelf(mod,id)?'primary':''}" data-act="shelf" data-mod="${mod}" data-id="${id}">${inShelf(mod,id)?'已加入书架':'加入书架'}</button>${it.img&&it.img.includes('steam')?`<a class="btn" href="https://store.steampowered.com/app/${it.img.match(/apps\/(\d+)/)?.[1]||''}" target="_blank">Steam页面</a>`:''}</div><h3>📊 状态追踪</h3><div class="form"><label>状态</label><select id="statusSel"><option value="">未设置</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${st.status===k?'selected':''}>${v.t}</option>`).join('')}</select>${isGame?`<label>游戏时长 (小时)</label><input type="number" id="gameH" value="${getTime(mod,id).game||''}" placeholder="0">`:''}${isNovel?`<label>阅读章节</label><input type="number" id="chapter" value="${st.chapter||''}" placeholder="0">`:''}<label>我的评分</label><div class="stars" style="font-size:22px;cursor:pointer" id="starBox">${[1,2,3,4,5].map(i=>`<span data-r="${i}" style="color:${(st.rating||0)>=i?'var(--warn)':'var(--muted)'}">★</span>`).join('')}</div><label>评价</label><textarea id="comment" placeholder="写下你的评价...">${esc(getComment(mod,id))}</textarea><div style="margin-top:8px"><button class="btn primary" id="saveBtn">保存</button></div></div>${related.length?`<h3>相关推荐</h3><div class="grid">${related.map(r=>renderCard(r,mod)).join('')}</div>`:''}</div>`;bindLinks();document.getElementById('starBox').onclick=e=>{if(e.target.dataset.r){const r=+e.target.dataset.r;[...document.getElementById('starBox').children].forEach((c,i)=>c.style.color=i<r?'var(--warn)':'var(--muted)');document.getElementById('starBox').dataset.val=r}};document.getElementById('saveBtn').onclick=()=>{const ns={};ns.status=document.getElementById('statusSel').value;if(isGame){const gh=document.getElementById('gameH').value;setTime(mod,id,{...getTime(mod,id),game:gh})}if(isNovel){ns.chapter=document.getElementById('chapter').value}ns.rating=+document.getElementById('starBox').dataset.val||0;setState(mod,id,ns);setComment(mod,id,document.getElementById('comment').value);toast('已保存')}}
function renderShelf(){const s=shelf();app.innerHTML=`<div class="section-title">📚 我的书架 (${s.length})</div>${s.length?`<div class="shelf-grid">${s.map(x=>{const it=(DATA[x.mod]||[]).find(i=>i.id===x.id);if(!it)return'';return `<div class="shelf-item" data-href="#/${x.mod}/${x.id}"><div class="thumb" style="background:${cover(it.id)}">${(effImg(x.mod,x.id)||it.img)?`<img src="${esc(effImg(x.mod,x.id)||it.img)}" alt="">`:''}</div><div class="info"><div class="name">${esc(it.name)}</div><div class="sub">${catEmoji(it.cat)} ${x.mod==='games'?'游戏':x.mod==='novels'?'小说':x.mod==='movies'?'影音':'学习'}</div></div></div>`}).join('')}</div>`:'<div class="empty">书架是空的，去添加一些内容吧</div>'}`;bindLinks()}
function renderStats(){const sm=stateMap();const gameStates={};DATA.games.forEach(g=>{const s=(sm['games:'+g.id]||{}).status||'none';gameStates[s]=(gameStates[s]||0)+1});const novelStates={};DATA.novels.forEach(n=>{const s=(sm['novels:'+n.id]||{}).status||'none';novelStates[s]=(novelStates[s]||0)+1});const totalGameH=DATA.games.reduce((sum,g)=>sum+(Number(getTime('games',g.id).game)||0),0);const totalUseH=DATA.games.reduce((sum,g)=>sum+(Number(getTime('games',g.id).use)||0),0);const catCount={};DATA.games.forEach(g=>{catCount[g.cat]=(catCount[g.cat]||0)+1});app.innerHTML=`<div class="section-title">📊 数据统计</div><div class="grid"><div class="card"><div class="content"><div class="title">游戏状态分布</div>${Object.entries(gameStates).map(([k,v])=>`<div style="display:flex;justify-content:space-between;margin:6px 0"><span>${k==='none'?'未设置':ST[k]?.t||k}</span><span>${v}</span></div>`).join('')}</div></div><div class="card"><div class="content"><div class="title">小说状态分布</div>${Object.entries(novelStates).map(([k,v])=>`<div style="display:flex;justify-content:space-between;margin:6px 0"><span>${k==='none'?'未设置':ST[k]?.t||k}</span><span>${v}</span></div>`).join('')}</div></div><div class="card"><div class="content"><div class="title">总时长</div><div style="font-size:32px;font-weight:800;color:var(--accent)">${Math.round(totalGameH)}<span style="font-size:14px;color:var(--muted)">h</span></div><div style="color:var(--muted)">游戏时长</div><div style="margin-top:12px;font-size:24px;font-weight:700">${Math.round(totalUseH)}<span style="font-size:14px;color:var(--muted)">h</span></div><div style="color:var(--muted)">使用时长</div></div></div><div class="card"><div class="content"><div class="title">游戏分类</div>${Object.entries(catCount).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="display:flex;justify-content:space-between;margin:6px 0"><span>${k}</span><span>${v}</span></div>`).join('')}</div></div></div>`}
function renderDIY(){const items=JSON.parse(localStorage.getItem('yz_diy')||'[]');app.innerHTML=`<div class="section-title">🔧 DIY专区</div><div class="toolbar"><button class="btn primary" data-act="adddiy">添加项目</button></div><div class="diy-grid">${items.map(d=>`<div class="diy-card"><div class="title">${esc(d.name)}</div><div class="url">${esc(d.url)}</div><div class="actions"><button class="btn" data-act="opendiy" data-url="${esc(d.url)}">打开</button><button class="btn" data-act="deldiy" data-id="${d.id}">删除</button></div></div>`).join('')}</div>${items.length?'':'<div class="empty">暂无DIY项目</div>'}`;bindLinks()}
function renderSearch(q){const term=q.toLowerCase();const results=[];DATA.games.filter(g=>g.name.toLowerCase().includes(term)||g.cat.toLowerCase().includes(term)).forEach(g=>results.push({mod:'games',it:g}));DATA.novels.filter(n=>n.name.toLowerCase().includes(term)||n.cat.toLowerCase().includes(term)||n.author?.toLowerCase().includes(term)).forEach(n=>results.push({mod:'novels',it:n}));DATA.study.filter(s=>s.name.toLowerCase().includes(term)||s.cat.toLowerCase().includes(term)).forEach(s=>results.push({mod:'study',it:s}));DATA.movies.filter(m=>m.name.toLowerCase().includes(term)||m.cat.toLowerCase().includes(term)).forEach(m=>results.push({mod:'movies',it:m}));const byMod={};results.forEach(r=>{byMod[r.mod]=(byMod[r.mod]||[]).r});app.innerHTML=`<div class="section-title">"${esc(q)}" 的搜索结果 (${results.length})</div>${results.length?Object.entries(byMod).map(([mod,arr])=>`<h3 style="color:var(--muted);font-size:14px;margin:16px 0 8px">${mod==='games'?'游戏':mod==='novels'?'小说':mod==='movies'?'影音':'学习'} (${arr.length})</h3><div class="grid">${arr.map(x=>renderCard(x.it,x.mod)).join('')}</div>`).join(''):'<div class="empty">没有找到相关内容</div>'}`;bindLinks()}
function bindLinks(){document.querySelectorAll('[data-href]').forEach(el=>el.onclick=()=>location.hash=el.dataset.href)}
function router(){const h=location.hash.slice(1)||'/home';const [path]=h.split('?');updateStatus();document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('active'));const active=document.querySelector(`.nav a[href="#${path}"]`);if(active)active.classList.add('active');if(path==='/home'||path==='')renderHome();else if(path==='/games')renderList('games','游戏库',DATA.games);else if(path==='/novels')renderList('novels','小说库',DATA.novels);else if(path==='/study')renderList('study','学习资料',DATA.study);else if(path==='/movies')renderList('movies','影音收藏',DATA.movies);else if(path==='/shelf')renderShelf();else if(path==='/stats')renderStats();else if(path==='/diy')renderDIY();else if(path.startsWith('/search')){const q=new URLSearchParams(location.hash.split('?')[1]||'').get('q')||'';if(q)renderSearch(q);else renderHome()}else{const m=path.match(/^\/(games|novels|study|movies)\/(.+)$/);if(m)renderDetail(m[1],m[2]);else renderHome()}}
function init(){setTheme(getTheme());updateStatus();router();window.addEventListener('hashchange',router);document.getElementById('themeBtn').onclick=()=>setTheme(getTheme()==='dark'?'light':'dark');document.getElementById('exportBtn').onclick=exportData;document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();document.getElementById('fileInput').onchange=e=>{if(e.target.files[0])importData(e.target.files[0])};document.getElementById('updateBtn').onclick=()=>{toast('已是最新版本')};document.getElementById('q').onkeydown=e=>{if(e.key==='Enter'){const v=e.target.value.trim();if(v)location.hash=`#/search?q=${encodeURIComponent(v)}`}};document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const act=t.dataset.act;if(act==='checkin'){addCheckin();toast('打卡成功！');renderHome()}if(act==='random'){const all=[...DATA.games.map(g=>({m:'games',it:g})),...DATA.novels.map(n=>({m:'novels',it:n})),...DATA.study.map(s=>({m:'study',it:s})),...DATA.movies.map(m=>({m:'movies',it:m}))];const pick=all[Math.floor(Math.random()*all.length)];if(pick)location.hash=`#/${pick.m}/${pick.it.id}`}if(act==='shelf'){toggleShelf(t.dataset.mod,t.dataset.id);t.textContent=inShelf(t.dataset.mod,t.dataset.id)?'已加入书架':'加入书架';t.classList.toggle('primary')}if(act==='adddiy'){const name=prompt('名称:');const url=prompt('链接:');if(name&&url){const items=JSON.parse(localStorage.getItem('yz_diy')||'[]');items.push({id:'d'+Date.now(),name,url});localStorage.setItem('yz_diy',JSON.stringify(items));renderDIY()}}if(act==='opendiy')window.open(t.dataset.url,'_blank');if(act==='deldiy'){const items=JSON.parse(localStorage.getItem('yz_diy')||'[]');const filtered=items.filter(x=>x.id!==t.dataset.id);localStorage.setItem('yz_diy',JSON.stringify(filtered));renderDIY()}});document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='k'){e.preventDefault();document.getElementById('q').focus()}if(e.key==='Escape'){const m=document.getElementById('modal');if(m.classList.contains('active'))m.classList.remove('active')}});if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}
init();
</script>
</body>
